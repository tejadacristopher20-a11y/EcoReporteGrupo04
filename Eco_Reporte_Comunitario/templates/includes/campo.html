<div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">
        {{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
    {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
</div>
