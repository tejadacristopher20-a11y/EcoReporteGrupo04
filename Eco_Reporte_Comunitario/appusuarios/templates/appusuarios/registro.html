{% extends "base.html" %}

{% block titulo %}Crear cuenta · EcoReporte{% endblock %}

{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card eco-tarjeta">
                <div class="card-body p-4">
                    <h1 class="h4 mb-1">Crear cuenta</h1>
                    <p class="text-body-secondary small">Regístrate para reportar problemas ambientales en tu comunidad.</p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include "includes/formulario.html" %}
                        <button type="submit" class="btn btn-success w-100">Crear cuenta</button>
                    </form>
                    <p class="text-center small mt-3 mb-0">
                        ¿Ya tienes cuenta? <a href="{% url 'appusuarios:ingresar' %}">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
