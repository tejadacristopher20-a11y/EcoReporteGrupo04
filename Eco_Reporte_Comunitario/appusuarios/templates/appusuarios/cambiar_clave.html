{% extends "base.html" %}

{% block titulo %}Cambiar contraseña · EcoReporte{% endblock %}

{% block contenido %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card eco-tarjeta">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Cambiar contraseña</h1>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include "includes/formulario.html" %}
                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-success">Cambiar contraseña</button>
                            <a class="btn btn-outline-secondary" href="{% url 'appusuarios:perfil' %}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
